<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Login — Monkey Sholders Co-living PG</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>:root{--cream:#FFF8F1;--amber:#F6C390;--ink:#33261E;--muted:#7A675C}*{margin:0;box-sizing:border-box;font-family:Inter,system-ui}body{background:linear-gradient(140deg,#FFE9D6,#E4F0E7);min-height:100vh;display:grid;place-items:center;padding:20px}h1{font-family:Fraunces,serif}.card{background:#fff;border-radius:26px;box-shadow:0 24px 60px rgba(90,55,25,.16);padding:38px;max-width:430px;width:100%}.tabs{display:flex;background:#FFF3E6;border-radius:999px;padding:5px;margin:20px 0}.tabs button{flex:1;border:none;background:transparent;padding:11px;border-radius:999px;font-weight:800;cursor:pointer;font-size:15px}.tabs button.on{background:var(--ink);color:#fff}input{width:100%;padding:14px 16px;border:1.5px solid #ecdccc;border-radius:12px;margin-top:12px;font-size:15px;background:#FFFCF8}.btn{width:100%;margin-top:18px;background:var(--amber);border:none;padding:15px;border-radius:999px;font-weight:800;font-size:16px;cursor:pointer}.demo{background:#EAF4EE;border-radius:12px;padding:13px 15px;font-size:13.5px;margin-top:16px;line-height:1.7;color:#2f4a3a}a{color:var(--ink)}</style></head>
<body><div class="card">
<a href="index.html" style="font-weight:700;font-size:14px">← Back to website</a>
<h1 style="margin-top:14px;font-size:30px">🐒 Monkey Sholders</h1><p style="color:var(--muted);margin-top:6px">Tenant &amp; Admin portal — demo</p>
<div class="tabs"><button id="t-tenant" class="on" onclick="setRole('tenant')">👤 Tenant</button><button id="t-admin" onclick="setRole('admin')">🛠️ Admin</button></div>
<input id="email" value="tenant@monkeysholders.in"/><input type="password" value="demo1234"/>
<button class="btn" onclick="go()">Login →</button>
<div class="demo"><b>Demo login — no real account needed:</b><br/>Tenant: tenant@monkeysholders.in · Admin: admin@monkeysholders.in<br/>Password: anything (demo). Switch role above.</div>
</div><script>let role='tenant';function setRole(r){role=r;document.getElementById('t-tenant').classList.toggle('on',r==='tenant');document.getElementById('t-admin').classList.toggle('on',r==='admin');document.getElementById('email').value=r==='tenant'?'tenant@monkeysholders.in':'admin@monkeysholders.in'}function go(){localStorage.setItem('ms_role',role);location.href=role==='tenant'?'tenant.html':'admin.html'}</script></body></html>
